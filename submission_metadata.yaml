ai_usage_summary: |
  Used Claude 3.5 Sonnet and Gemini 3.5 Flash inside Antigravity IDE to design the scoring heuristics, trap detection algorithms, and reasoning generator. No candidate data was shared with external LLM APIs during candidate precomputation or ranking execution.

methodology_summary: |
  Hybrid retrieval + structured scoring + trap-aware reranking system.
  Employs a local sentence-transformer (all-MiniLM-L6-v2) for initial candidate semantic recall, producing a FAISS IndexFlatIP cosine similarity search over the 100,000 pool to retrieve the top 10,000.
  A robust secondary structured scoring framework evaluates technical alignment, experience fit (targeting 6-8 years), location proximity (preferring Noida/Pune), and platform behavioral engagement.
  Inconsistencies are aggressively penalized using trap detection heuristics (impossible salaries, zero-duration expert skills, profile/career duration mismatches) to filter out synthetic honeypots and keyword stuffers.
  Outputs deterministic, factual, rank-appropriate reasons for selected candidates.

declarations:
  read_submission_spec: true
